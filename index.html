<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#d8f7f1" />
  <link rel="icon" href="data:," />
  <title>俄罗斯方块</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#e6fbf7; --surface:#fbfffe; --surface-2:#caeee7; --ink:#092a2b;
      --muted:#3f6e70; --line:rgba(21,84,82,.22); --dark:#0b3236; --accent:#008b78;
      --shadow:0 24px 64px rgba(20,93,88,.20);
      --button:#0b3439; --button-ink:#f8fffd; --well:#03141a;
      --control-bg:rgba(7,46,51,.78); --control-line:rgba(220,250,245,.26);
      --frame:#202a38; --gold:#d9ad58; --bezel:#9b7740;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f3639; --surface:#0c292d; --surface-2:#15474a; --ink:#f1fffb;
        --muted:#b8dcd5; --line:rgba(171,225,215,.26); --dark:#04191d; --accent:#26c7aa;
        --shadow:0 28px 84px rgba(0,12,14,.48); --button:#f1fffb; --button-ink:#f7fffd; --well:#020d12;
        --control-bg:rgba(4,31,35,.86); --control-line:rgba(205,244,235,.22);
        --frame:#161d29; --gold:#ddbd72; --bezel:#a4834d;
      }
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overscroll-behavior:none}
    body{
      margin:0; color:var(--ink); background:var(--bg); overflow:hidden;
      font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
      background-image:
        radial-gradient(ellipse at 50% -18%,rgba(255,255,255,.98),transparent 48%),
        radial-gradient(circle at 7% 88%,rgba(10,188,154,.28),transparent 33%),
        radial-gradient(circle at 91% 14%,rgba(247,190,63,.24),transparent 27%),
        conic-gradient(from 205deg at 50% 48%,rgba(7,84,86,.05),rgba(255,255,255,.22),rgba(7,84,86,.07),rgba(255,255,255,.20),rgba(7,84,86,.05)),
        linear-gradient(124deg,rgba(249,255,253,.88),transparent 42%,rgba(56,202,188,.15) 82%,transparent);
      display:grid; place-items:center;
      padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.10;mix-blend-mode:multiply;
      background-image:
        repeating-linear-gradient(7deg,rgba(10,55,104,.22) 0 .45px,transparent .7px 4.2px),
        repeating-linear-gradient(97deg,rgba(255,255,255,.42) 0 .5px,transparent .8px 5.8px);
      background-size:11px 11px,13px 13px;
    }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:19;
      box-shadow:inset 0 0 150px rgba(20,38,62,.20),inset 0 0 24px rgba(12,28,49,.10);
    }
    button{font:inherit}
    .game-shell{
      width:min(100%,1160px); height:100%; min-height:0;position:relative;z-index:1;isolation:isolate;
      display:grid; grid-template-columns:minmax(170px,1fr) minmax(320px,440px) minmax(190px,1fr);
      grid-template-rows:minmax(0,1fr); gap:18px 24px; align-items:stretch;
    }
    .level-backdrop{
      position:fixed;z-index:0;left:50%;top:51%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;
      display:flex;align-items:center;gap:1.2vw;color:rgba(7,70,70,.030);text-shadow:none;
      font-family:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:nowrap;
    }
    .level-backdrop::before,.level-backdrop::after{content:"";width:min(11vw,150px);height:2px;background:currentColor;box-shadow:0 -8px 0 -0.5px currentColor,0 8px 0 -0.5px currentColor;clip-path:polygon(0 35%,82% 35%,88% 0,100% 0,100% 100%,88% 100%,82% 65%,0 65%)}
    .level-backdrop::after{transform:scaleX(-1)}
    .level-backdrop span{font-size:clamp(14px,2.4vw,32px);letter-spacing:.52em}
    .level-backdrop strong{font-size:clamp(120px,24vw,340px);font-weight:500;line-height:.72;letter-spacing:-.12em}
    @media (prefers-color-scheme:dark){.level-backdrop{color:rgba(104,235,210,.030)}}
    .panel,.board-frame{border:0;box-shadow:var(--shadow)}
    .panel{
      padding:18px;display:flex;flex-direction:column;gap:20px;min-height:0;color:#edf3fb;border-radius:14px;
      background:
        radial-gradient(circle at 12% 4%,rgba(51,132,166,.18),transparent 35%),
        linear-gradient(116deg,rgba(255,255,255,.06),transparent 38%),
        repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 7px),#111c27;
      box-shadow:0 20px 54px rgba(4,10,20,.28),inset 0 1px 0 rgba(220,232,248,.08);
    }
    .panel .label,.panel .next-title,.panel .instructions,.panel .text-btn{color:#aebdce}
    .panel .key{color:#f1f5fb}
    .panel .stat,.panel .actions{border-color:rgba(148,169,197,.22)}
    .panel .text-btn{border-color:rgba(148,169,197,.26)}
    .panel .text-btn:hover{color:#f7f9fc;border-color:#9bb8dc}
    .panel.left{justify-content:space-between;grid-row:1}
    .stat{border-bottom:1px solid var(--line); padding-bottom:16px}
    .stat:last-child{border-bottom:0;padding-bottom:0}
    .label{display:block;color:var(--muted);font-size:12px;letter-spacing:.14em;margin-bottom:5px}
    .value{font:500 clamp(24px,3vw,34px)/1 "DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
    .level-row{display:flex;align-items:end;justify-content:space-between;gap:8px}
    .level-stat{position:relative;isolation:isolate;overflow:visible}
    .level-stat::before,.level-stat::after{content:"";position:absolute;pointer-events:none;z-index:-1;opacity:0}
    .level-stat::before{width:66px;height:66px;left:-15px;bottom:-13px;border-radius:50%}
    .level-stat::after{width:42px;height:42px;left:-3px;bottom:-1px;border-radius:50%}
    body[data-level-style] .level-stat::before{
      opacity:.42;background:radial-gradient(circle,hsla(var(--level-hue),92%,72%,.30) 0 18%,hsla(var(--level-hue),88%,55%,.13) 42%,transparent 72%);
      box-shadow:0 0 16px hsla(var(--level-hue),90%,62%,.18);animation:levelPulse 2.15s ease-in-out infinite;
    }
    body[data-level-style] .level-stat::after{
      opacity:.48;border:1px solid hsla(var(--level-hue),96%,78%,.42);box-shadow:0 0 12px hsla(var(--level-hue),92%,64%,.20),inset 0 0 7px hsla(var(--level-hue),94%,68%,.12);
    }
    body[data-level-style="orbit"] .level-stat::after{animation:levelSpin 3.4s linear infinite;border-style:dashed}
    body[data-level-style="ember"] .level-stat::before{animation:levelHeat 1.45s ease-in-out infinite alternate}
    body[data-level-style="flare"] .level-stat::after{animation:levelPulse 1.1s ease-in-out infinite}
    body[data-level-style="cyclone"] .level-stat::before{background:conic-gradient(from 20deg,transparent 0 16%,hsla(var(--level-hue),96%,74%,.33) 23%,transparent 35% 57%,hsla(var(--level-hue),90%,64%,.24) 66%,transparent 78%);animation:levelSpin 2.35s linear infinite}
    body[data-level-style="storm"] .level-stat::after{animation:levelStorm .95s steps(2,end) infinite}
    body[data-level-tier="fire"] .level-stat::before{
      opacity:.88;background:radial-gradient(circle,rgba(255,203,101,.26) 0 25%,rgba(245,95,30,.14) 45%,transparent 72%);
      box-shadow:0 0 18px rgba(255,111,31,.24),0 0 35px rgba(255,63,17,.12);animation:levelHeat 1.35s ease-in-out infinite alternate;
    }
    body[data-level-tier="fire"] .level-stat::after{opacity:.65;border:1px solid rgba(255,191,88,.52);box-shadow:inset 0 0 10px rgba(255,88,24,.22);animation:levelPulse 1.8s ease-in-out infinite}
    body[data-level-tier="vortex"] .level-stat::before{
      opacity:.82;background:conic-gradient(from 30deg,transparent 0 18%,rgba(107,222,255,.36) 25%,transparent 37% 58%,rgba(85,174,232,.28) 68%,transparent 78%);
      filter:blur(.3px);animation:levelSpin 2.8s linear infinite;
    }
    body[data-level-tier="vortex"] .level-stat::after{opacity:.74;border:1px solid rgba(146,228,255,.44);box-shadow:0 0 16px rgba(67,190,235,.24),inset 0 0 9px rgba(117,220,255,.16);animation:levelPulse 1.55s ease-in-out infinite}
    body[data-level-tier="storm"] .level-stat::before{
      opacity:.92;background:conic-gradient(from 12deg,transparent 0 12%,rgba(203,246,255,.55) 16%,transparent 20% 45%,rgba(91,187,255,.35) 53%,transparent 62%);
      box-shadow:0 0 20px rgba(110,213,255,.32);animation:levelSpin 1.55s linear infinite;
    }
    body[data-level-tier="storm"] .level-stat::after{opacity:.85;border:1px solid rgba(220,249,255,.58);box-shadow:0 0 8px rgba(229,252,255,.5),0 0 24px rgba(77,177,255,.34);animation:levelStorm .95s steps(2,end) infinite}
    .level-stat.level-up .value{animation:levelNumber .72s cubic-bezier(.17,.75,.23,1)}
    .level-stat.level-up::before{animation:levelBurst .72s cubic-bezier(.17,.75,.23,1)}
    @keyframes levelHeat{to{transform:translateY(-2px) scale(1.07);opacity:.68}}
    @keyframes levelPulse{50%{transform:scale(1.12);opacity:.38}}
    @keyframes levelSpin{to{transform:rotate(1turn)}}
    @keyframes levelStorm{50%{filter:brightness(1.85);transform:scale(1.06)}}
    @keyframes levelNumber{0%{transform:scale(.92)}38%{color:#fff4b4;text-shadow:0 0 14px currentColor;transform:scale(1.32)}100%{transform:scale(1)}}
    @keyframes levelBurst{0%{opacity:0;transform:scale(.5)}45%{opacity:1;transform:scale(1.45)}100%{opacity:0;transform:scale(1.8)}}
    .speed-bars{display:flex;gap:3px;height:22px;align-items:end}
    .speed-bars i{display:block;width:4px;background:var(--accent);opacity:.2}
    .speed-bars i.on{opacity:1}
    .board-frame{
      position:relative;padding:8px 8px 144px;width:min(100%,calc((100dvh - 142px)/2));height:100%;justify-self:center;align-self:center;display:flex;flex-direction:column;
      background:
        linear-gradient(112deg,rgba(255,255,255,.11),transparent 25%,rgba(0,0,0,.34)),
        repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),var(--frame);
      border-radius:24px;
      box-shadow:0 30px 80px rgba(3,9,18,.48),inset 0 1px 0 rgba(224,234,248,.14),inset 0 0 0 2px rgba(217,173,88,.30),inset 0 0 22px rgba(0,0,0,.38);
      transition:box-shadow .7s ease,filter .7s ease;
    }
    .board-frame::before{
      content:"";position:absolute;z-index:-1;inset:-5px;border-radius:29px;pointer-events:none;
      border:1px solid hsla(var(--level-hue,168),92%,68%,.22);
      box-shadow:0 0 34px hsla(var(--level-hue,168),92%,54%,.14),0 0 90px hsla(var(--level-hue,168),90%,48%,.08);
      opacity:calc(.45 + var(--level-power, .2));transition:all .7s ease;
    }
    #game{display:block;width:100%;height:auto;flex:1 1 auto;min-height:0;min-width:0;background:var(--well);touch-action:none;filter:saturate(1.22) contrast(1.09);border-radius:17px;box-shadow:inset 0 0 54px hsla(var(--level-hue,168),92%,52%,.075)}
    .screen{
      position:absolute;inset:8px 8px 144px;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;
      background:linear-gradient(rgba(3,7,14,.82),rgba(10,21,39,.89));color:#f1f5fb;backdrop-filter:blur(4px) saturate(.82);border-radius:17px;
    }
    .screen[hidden]{display:none}
    .screen-inner{max-width:240px}
    .screen h2{margin:0 0 8px;font:500 30px/1.1 "Noto Sans SC",sans-serif}
    .screen p{margin:0 0 22px;color:#c8c3b8;font-size:14px;line-height:1.7}
    .primary,.text-btn,.control{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .primary{background:var(--accent);color:#f7f9ff;padding:12px 25px;font-weight:600;min-width:124px;border-radius:8px;box-shadow:inset 0 1px 0 rgba(236,242,255,.20),0 8px 22px rgba(6,31,105,.28)}
    .primary:active{transform:translateY(1px)}
    .panel.right{justify-content:space-between;grid-column:3;grid-row:1}
    .next-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.12em}
    #next{display:block;width:100%;aspect-ratio:1;background:var(--well);margin-top:12px;border:0;border-radius:9px;box-shadow:inset 0 0 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(211,225,243,.08)}
    .instructions{font-size:12px;color:var(--muted);line-height:1.8}
    .key{font-family:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;color:var(--ink)}
    .actions{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}
    .text-btn{flex:1;padding:8px 4px;background:transparent;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
    .text-btn:hover{color:var(--ink);border-color:var(--ink)}
    .controls{
      position:absolute;z-index:4;left:12px;right:12px;bottom:9px;height:126px;padding:7px 10px;
      display:grid;grid-template-columns:minmax(176px,1fr) 92px;align-items:center;gap:15px;pointer-events:auto;
      border:1px solid rgba(221,234,246,.14);border-radius:28px 28px 18px 18px;
      background:
        radial-gradient(circle at 18% 20%,rgba(255,255,255,.11),transparent 32%),
        linear-gradient(164deg,rgba(50,66,86,.88),rgba(11,19,31,.94) 55%,rgba(4,10,18,.96));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -8px 14px rgba(0,0,0,.25),0 13px 24px rgba(0,0,0,.22);
    }
    .controls::after{
      content:"";position:absolute;inset:7px;border-radius:22px 22px 13px 13px;pointer-events:none;
      border:1px solid rgba(217,173,88,.16);box-shadow:inset 0 0 18px rgba(0,0,0,.20);
    }
    .dpad{
      width:164px;height:112px;justify-self:center;position:relative;filter:drop-shadow(0 8px 7px rgba(0,0,0,.34));
    }
    .dpad::before,.dpad::after{content:"";position:absolute;z-index:0;background:linear-gradient(145deg,#3f4a5b,#151d2a 52%,#070c14);box-shadow:inset 1px 1px 1px rgba(255,255,255,.17),inset -2px -3px 4px rgba(0,0,0,.45)}
    .dpad::before{width:62px;height:112px;left:51px;top:0;border-radius:15px}
    .dpad::after{width:164px;height:58px;left:0;top:27px;border-radius:15px}
    .control{
      min-width:0;min-height:0;color:#f3f8ff;display:grid;place-items:center;position:absolute;z-index:2;
      gap:0;padding:2px;border:1px solid rgba(230,239,251,.13);border-radius:11px;
      background:linear-gradient(155deg,#4b5668 0%,#242f40 42%,#101722 100%);
      box-shadow:inset 1px 1px 1px rgba(255,255,255,.18),inset -2px -3px 3px rgba(0,0,0,.42),0 2px 0 #050912;
      touch-action:none;user-select:none;-webkit-user-select:none;transition:filter .12s ease,transform .07s ease,box-shadow .07s ease;
    }
    .control svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;filter:drop-shadow(0 1px 0 rgba(0,0,0,.9))}
    .control span{position:absolute;font-size:7px;line-height:1;opacity:.55;white-space:nowrap;bottom:4px;letter-spacing:.04em}
    .control.up{left:55px;top:3px;width:54px;height:47px}.control.left{left:3px;top:31px;width:57px;height:51px}.control.down{left:55px;bottom:3px;width:54px;height:47px}.control.right{right:3px;top:31px;width:57px;height:51px}
    .control.rotate{
      position:relative;width:88px;height:88px;border-radius:50%;justify-self:center;
      background:
        radial-gradient(circle at 35% 27%,rgba(255,255,255,.34),transparent 13%),
        radial-gradient(circle at 48% 43%,#20bfa7 0%,#087e71 58%,#034b47 100%);
      color:#fffdf3;border:2px solid rgba(236,204,126,.72);
      box-shadow:inset 0 0 0 5px rgba(0,0,0,.14),inset 0 -7px 10px rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.22),0 0 0 5px #121b29,0 0 0 7px rgba(217,173,88,.28),0 9px 15px rgba(0,0,0,.35);
    }
    .control.rotate::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.16);pointer-events:none}
    .control.rotate svg{width:31px;height:31px}.control.rotate span{font-size:9px;font-weight:600;opacity:.8;bottom:13px;letter-spacing:.08em}
    .control:active,.control.active{transform:translateY(2px);filter:brightness(1.25);box-shadow:inset 0 2px 4px rgba(0,0,0,.36),0 1px 0 #050912}
    .control.rotate:active,.control.rotate.active{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 0 0 5px rgba(0,0,0,.10),0 0 0 5px #121b29,0 0 0 7px rgba(217,173,88,.34),0 4px 8px rgba(0,0,0,.38)}
    .control.down.hold-ready{filter:brightness(1.45);color:#fff2ad}
    .mobile-stats{display:none}
    @media(max-width:700px){
      body{padding:max(4px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));background-image:radial-gradient(ellipse at 50% -12%,rgba(255,255,255,.96),transparent 48%),radial-gradient(circle at 3% 82%,rgba(23,197,162,.28),transparent 36%),radial-gradient(circle at 97% 12%,rgba(255,211,92,.22),transparent 30%),conic-gradient(from 215deg at 50% 52%,rgba(7,84,86,.04),rgba(255,255,255,.2),rgba(7,84,86,.08),rgba(255,255,255,.2)),linear-gradient(120deg,rgba(238,255,250,.90),rgba(164,234,220,.38))}
      .game-shell{width:100%;height:100%;max-width:none;display:block;position:relative}
      .panel.left{display:none}
      .panel.right{
        position:absolute;z-index:4;left:10px;right:10px;top:10px;height:60px;padding:6px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;
        align-items:center;gap:7px;box-shadow:0 8px 22px rgba(2,18,43,.16);background:rgba(5,20,43,.66);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      }
      .panel.right>div:first-child{height:46px}.next-title{display:none}
      #next{width:46px;height:46px;margin:0;border-radius:9px}
      .mobile-stats{display:grid;grid-template-columns:minmax(92px,1.8fr) minmax(34px,.65fr) minmax(34px,.65fr);gap:9px;align-items:center;min-width:0}
      .mobile-stats .stat{border:0;padding:0;min-width:0;overflow:visible}
      .mobile-stats .level-stat::before{width:50px;height:50px;left:-12px;bottom:-10px}
      .mobile-stats .level-stat::after{width:34px;height:34px;left:-4px;bottom:-3px}
      .mobile-stats .value{display:block;font-size:clamp(16px,4.8vw,20px);letter-spacing:.015em;white-space:nowrap}
      .mobile-stats .stat:not(:first-child) .value{font-size:clamp(15px,4vw,18px)}
      .mobile-stats .label{font-size:7px;margin-bottom:3px;letter-spacing:.10em;white-space:nowrap}
      .actions{border:0;padding:0;display:grid;grid-template-columns:repeat(3,24px);gap:0}.text-btn{font-size:0;padding:0;min-width:24px;height:36px;border:0;position:relative}
      .text-btn::after{display:grid;place-items:center;font:500 10px/1 "DM Mono",ui-monospace,Menlo,Consolas,monospace;color:#d7e2f0}
      #musicBtn::after{content:"♪"}#pauseBtn::after{content:"Ⅱ"}#restartBtn::after{content:"↻"}
      .level-backdrop{top:57%;opacity:.9}.level-backdrop span{font-size:15px}.level-backdrop strong{font-size:clamp(126px,45vw,178px)}
      .board-frame{width:min(100%,calc((100dvh - 136px)/2));height:100%;max-height:100%;padding:5px 5px 142px;border-radius:22px;box-shadow:0 18px 44px rgba(2,8,16,.22)}
      #game{border-radius:17px}.screen{inset:5px 5px 142px}.screen h2{font-size:27px}.screen p{font-size:13px}
      .controls{left:7px;right:7px;bottom:6px;height:130px;padding:8px;grid-template-columns:minmax(170px,1fr) 88px;gap:10px;border-radius:27px 27px 16px 16px}
      .dpad{width:164px;height:112px}
      .control svg{width:25px;height:25px;stroke-width:2.2}.control span{font-size:7px;font-weight:500}
      .control.rotate{width:84px;height:84px;border-radius:50%}.control.rotate svg{width:30px;height:30px}.control.rotate span{font-size:9px}
    }
    @media(max-width:360px){
      .panel.right{left:7px;right:7px;top:7px;grid-template-columns:40px minmax(0,1fr) auto;gap:5px;padding:5px}
      .panel.right>div:first-child,#next{width:40px;height:40px}.mobile-stats{grid-template-columns:minmax(84px,1.7fr) minmax(31px,.65fr) minmax(31px,.65fr);gap:5px}.mobile-stats .value{font-size:14px}
      .actions{grid-template-columns:repeat(3,21px)}.text-btn{min-width:21px}

      var roots=[65.41,55,43.65,49],step=musicStep%128,n=step%64,variation=step>=64,bar=Math.floor(n/16),within=n%16;
      var chord=chords[bar],root=roots[bar],intensity=Math.min(1,(level-1)/10),delay=Math.max(0,atTime-audioCtx.currentTime);
      var arpA=[0,1,2,1,0,2,1,2],arpB=[0,2,1,2,0,1,2,1],arpOrder=variation?arpB:arpA;
      var melodyA=[0,0,392,0,440,0,392,0,0,0,329.63,0,293.66,0,0,0];
      var melodyB=[0,0,440,0,493.88,0,523.25,0,0,0,493.88,0,440,0,392,0];
      if(within%4===0)playTone(root,.34,'sine',.012+intensity*.002,delay,520,-2);
      if(within%2===0){var arp=chord[arpOrder[(within/2)%8]];playTone(arp,.14,'triangle',.0048+intensity*.0016,delay,2100+intensity*500,variation?2:-2);}
      if(within===0||within===8)playChord(chord,.42,.0024+intensity*.0008,1300+intensity*360,delay);
      var lead=variation?melodyB:melodyA;if((bar===1||bar===3)&&lead[within])playTone(lead[within],.18,'sine',.0048+intensity*.0012,delay,2400,3);
      if(level>=6&&within%4===2){var sparkle=chord[(within/2+bar)%chord.length]*2;playTone(sparkle,.075,'sine',.0018+intensity*.0008,delay,4200,4);}
      musicStep++;
    }
    function musicDelay(){return Math.max(142,210-(level-1)*4.5);}
    function scheduleMusic(){
      if(!musicOn||!running||paused||!audioCtx)return;
      var stepSeconds=musicDelay()/1000;
      if(nextNoteTime<audioCtx.currentTime-.02){
        var missed=Math.floor((audioCtx.currentTime-nextNoteTime)/stepSeconds)+1;
        musicStep+=missed;nextNoteTime+=missed*stepSeconds;
      }
      while(nextNoteTime<audioCtx.currentTime+.12){musicTick(nextNoteTime);nextNoteTime+=stepSeconds;}
    }
    function startMusic(){
      if(!musicOn||!running||paused||musicTimer||musicStartPending)return;
      musicStartPending=true;
      initAudio().then(function(unlocked){
        musicStartPending=false;
        if(!unlocked||!musicOn||!running||paused||musicTimer)return;
        nextNoteTime=audioCtx.currentTime+.045;scheduleMusic();musicTimer=setInterval(scheduleMusic,25);
      });
    }
    function stopMusic(){clearInterval(musicTimer);musicTimer=0;musicStartPending=false;}
    function updateMusicButton(){musicBtn.textContent=musicOn?'电子乐：开':'电子乐：关';musicBtn.setAttribute('aria-pressed',musicOn?'true':'false');}
    function toggleMusic(){musicOn=!musicOn;updateMusicButton();if(musicOn&&running&&!paused)startMusic();else stopMusic();}
    function startGame(){initAudio();board=emptyBoard();score=0;lines=0;level=1;combo=0;bag=[];effects=[];nextPiece=null;running=true;paused=false;over=false;lastTime=performance.now();dropCounter=0;musicStep=0;screen.hidden=true;pauseBtn.textContent='暂停';updateHud();spawn();startMusic();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
    function endGame(){running=false;over=true;stopMusic();screenTitle.textContent='游戏结束';screenText.textContent='本局 '+score+' 分 · 消除 '+lines+' 行';startBtn.textContent='再来一局';screen.hidden=false;draw();}
    function togglePause(){if(over||!piece)return;if(!running&&paused){running=true;paused=false;screen.hidden=true;pauseBtn.textContent='暂停';lastTime=performance.now();startMusic();raf=requestAnimationFrame(loop);}else if(running){running=false;paused=true;stopMusic();screenTitle.textContent='已暂停';screenText.textContent='休息一下，回来继续。';startBtn.textContent='继续游戏';screen.hidden=false;pauseBtn.textContent='继续';cancelAnimationFrame(raf);}}
    function loop(time){if(!running)return;var delta=time-lastTime;lastTime=time;dropCounter+=delta;if(dropCounter>interval())stepDown(false);draw();raf=requestAnimationFrame(loop);}
    function flash(btn){btn.classList.add('active');setTimeout(function(){btn.classList.remove('active');},90);}
    function bindRepeater(id,action){
      var b=document.getElementById(id),delayTimer=0,repeatTimer=0,pointerId=null;
      function stop(){clearTimeout(delayTimer);clearInterval(repeatTimer);delayTimer=repeatTimer=0;pointerId=null;b.classList.remove('active');}
      b.addEventListener('pointerdown',function(e){
        if(e.button!==undefined&&e.button!==0)return;e.preventDefault();stop();pointerId=e.pointerId;b.classList.add('active');
        if(b.setPointerCapture)try{b.setPointerCapture(e.pointerId);}catch(ignore){}
        action();delayTimer=setTimeout(function(){repeatTimer=setInterval(action,72);},210);
      });
      b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
    }
    function bindDropButton(){
      var b=document.getElementById('downBtn'),holdTimer=0,held=false,pointerId=null;
      function clearVisual(){clearTimeout(holdTimer);holdTimer=0;pointerId=null;b.classList.remove('active','hold-ready');}
      b.addEventListener('pointerdown',function(e){
        if(e.button!==undefined&&e.button!==0)return;e.preventDefault();clearVisual();pointerId=e.pointerId;held=false;b.classList.add('active');
        if(b.setPointerCapture)try{b.setPointerCapture(e.pointerId);}catch(ignore){}
        holdTimer=setTimeout(function(){held=true;b.classList.add('hold-ready');hardDrop();},360);
      });
      b.addEventListener('pointerup',function(e){if(pointerId!==null&&!held)stepDown(true);clearVisual();});
      b.addEventListener('pointercancel',clearVisual);b.addEventListener('lostpointercapture',clearVisual);
      b.addEventListener('contextmenu',function(e){e.preventDefault();});
    }
    function primeAudioFromGesture(){
      initAudio().then(function(unlocked){if(unlocked&&musicOn&&running&&!paused&&!musicTimer)startMusic();});
    }
    /* Prime audio on the earliest user-gesture event. Shared links often run in
       an embedded mobile webview where waiting for `click` loses activation. */
    document.addEventListener('pointerdown',primeAudioFromGesture,true);
    document.addEventListener('touchstart',primeAudioFromGesture,{capture:true,passive:true});
    document.addEventListener('keydown',primeAudioFromGesture,true);
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&musicOn&&running&&!paused)startMusic();
    });
    startBtn.addEventListener('click',function(){if(paused)togglePause();else startGame();});
    musicBtn.addEventListener('click',toggleMusic);pauseBtn.addEventListener('click',togglePause);restartBtn.addEventListener('click',startGame);
    bindRepeater('leftBtn',function(){move(-1);});
    bindRepeater('rightBtn',function(){move(1);});
    document.getElementById('upBtn').addEventListener('pointerdown',function(e){e.preventDefault();hardDrop();flash(this);});
    document.getElementById('rotateBtn').addEventListener('pointerdown',function(e){e.preventDefault();rotate();flash(this);});
    bindDropButton();
    document.addEventListener('keydown',function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','p','P'].indexOf(e.key)>=0)e.preventDefault();if(e.repeat&&['ArrowUp',' ','p','P'].indexOf(e.key)>=0)return;if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowUp')rotate();else if(e.key==='ArrowDown')stepDown(true);else if(e.key===' ')hardDrop();else if(e.key==='p'||e.key==='P')togglePause();});
    var touchStart=null;canvas.addEventListener('pointerdown',function(e){touchStart={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointerup',function(e){if(!touchStart)return;var dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy>45)hardDrop();touchStart=null;});
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){draw();drawNext();});
    board=emptyBoard();updateHud();draw();drawNext();
  })();
  </script>
